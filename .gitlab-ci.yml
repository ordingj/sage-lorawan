image: python:3.14.7-alpine3.24@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc

stages:
  - validate

validate:
  stage: validate
  before_script:
    - python -m pip install --no-cache-dir -r requirements-dev.txt
  script:
    - python -m ruff format --check app tests
    - python -m ruff check app tests
    - python -m pytest -W error
