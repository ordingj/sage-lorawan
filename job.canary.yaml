name: ihv-cenic-chirpstack-devices-h02a-canary
plugins:
  - name: ihv-cenic-chirpstack-devices
    pluginSpec:
      image: registry.sagecontinuum.org/ordingj/ihv-cenic-chirpstack-devices:0.1.0
      args:
        - --mqtt-host
        - 192.168.1.200
        - --mqtt-port
        - "1883"
        - --mqtt-topic
        - application/+/device/+/event/up
        - --mqtt-client-id
        - ihv-sage-h02a-canary
        - --dry-run
nodeTags: []
nodes:
  H02A: true
scienceRules:
  - 'schedule("ihv-cenic-chirpstack-devices"): cronjob("ihv-cenic-chirpstack-devices", "* * * * *")'
successCriteria:
  - WallClock("10minutes")
